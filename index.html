<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mestre do Confinamento: Mobile Tilt Edition</title>
<style>
  :root { --ink: #2b2118; --cream: #fff6e0; --wood: #8a5a2b; --wood-dark: #5e3a1a; --green: #3f9e3a; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #2f5a2c;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: var(--ink);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }

  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(25,15,5,.55); padding: 16px; z-index: 5;
  }
  #overlay.show { display: flex; }
  .card {
    background: var(--cream); border: 6px solid var(--wood); border-radius: 18px;
    box-shadow: 0 0 0 4px var(--wood-dark), 0 14px 40px rgba(0,0,0,.55);
    width: min(520px, 100%); max-height: 100%; overflow: auto; padding: 22px 24px; text-align: center;
  }
  .card h1 { margin: 0 0 4px; font-size: 30px; color: var(--wood-dark); line-height: 1.1; }
  .card h2 { margin: 0 0 6px; font-size: 24px; color: var(--wood-dark); }
  .card p { margin: 8px 0; font-size: 16px; line-height: 1.4; }
  .card .sub { color: #7a6a52; font-size: 14px; }
  .keys { display: flex; gap: 10px; justify-content: center; margin: 12px 0 4px; flex-wrap: wrap; }
  kbd {
    display: inline-block; min-width: 44px; padding: 6px 12px; border-radius: 8px; font: 800 20px "Trebuchet MS", sans-serif;
    background: #fff; border: 2px solid var(--wood-dark); border-bottom-width: 5px; color: var(--wood-dark);
  }
  .lanes { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 12px 0; }
  .chip { flex: 1 1 100px; max-width: 140px; border-radius: 10px; border: 3px solid var(--wood-dark); background: #fff; overflow: hidden; font-size: 13px; }
  .chip b { display: block; color: #fff; padding: 4px 2px; font-size: 14px; letter-spacing: .5px; }
  .chip span { display: block; padding: 5px 4px; font-weight: 700; line-height: 1.25; }
  .stats { display: flex; justify-content: center; gap: 22px; margin: 12px 0; font-weight: 700; }
  .stats i { display: block; font: 800 28px "Trebuchet MS", sans-serif; font-style: normal; }
  .stars { font-size: 38px; color: #e8a823; letter-spacing: 4px; }
  button.go {
    margin-top: 10px; padding: 12px 30px; font: 800 20px "Trebuchet MS", sans-serif; color: #fff; cursor: pointer;
    background: var(--green); border: 3px solid #266b24; border-bottom-width: 6px; border-radius: 14px;
  }
  #level {
    position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 4;
    display: none; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 22px;
    background: rgba(40,24,10,.78); border: 2px solid #d6a15a; color: #fff0cf; font: 800 14px "Trebuchet MS", sans-serif;
    pointer-events: none;
  }
  #level.on { display: flex; }
  #level .vial { position: relative; width: min(46vw, 220px); height: 20px; border-radius: 10px; background: linear-gradient(#cfe9a6, #8cc255); border: 2px solid #3d230d; }
  #level .vial i { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: rgba(0,0,0,.35); }
  #level #bubble { position: absolute; top: 1px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px rgba(255,255,255,.9), inset -2px -2px 3px rgba(0,0,0,.25); }
  #level em { min-width: 40px; text-align: right; font-style: normal; }
  button.go:active { transform: translateY(3px); border-bottom-width: 3px; }
  button.alt { background: #8a7a62; border-color: #5e5240; font-size: 15px; padding: 8px 16px; margin-left: 8px; }
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>
<div id="overlay"><div class="card" id="card"></div></div>
<!-- Nível de bolha: mostra a inclinação atual em tempo real -->
<div id="level" aria-hidden="true"><span>◀</span><div class="vial"><i></i><b id="bubble"></b></div><span>▶</span><em id="deg">0°</em></div>

<script>
/* =====================================================================
   MESTRE DO CONFINAMENTO — visão aérea (Top-Down 2D) em Canvas

   Fluxo: o boi entra pela manga (topo), passa pela balança coberta (centro)
   e desce em direção aos piquetes (base). Ele avança sozinho no eixo Y; o
   jogador só controla o desvio lateral (eixo X) por `inputAxisX`.

   Estados: 'menu' -> 'intro' -> 'playing' -> 'phaseDone' | 'over'
   ===================================================================== */

// ---------- Geometria do curral (coordenadas lógicas 720 x 960) ----------
const W = 720, H = 960, CX = 360;
const FAN_TOP = 340, FAN_BOT = 700;   // leque radial: da saída da balança até a cabeça dos piquetes
const GATE = 790;                     // linha da porteira: aqui o piquete escolhido é conferido
const END = 940;                      // fundo dos piquetes
const LX = 20, RX = 700;              // paredes externas dos piquetes
const SCALE_Y0 = 195, SCALE_Y1 = 335; // plataforma da balança
const HALF = 26;                      // meia-largura do boi (colisão)
const VMAX = 300;                     // velocidade lateral máxima (px/s)
const POINTS = 100, WEIGH_T = 0.8;
const START_LIVES = 5;                // vidas da partida
const TIME_RESET = 15;                // segundos que sobram depois que o tempo da fase estoura (e custa 1 vida)
const TAU = Math.PI * 2;
const LANE_COLORS = ['#3b9be0', '#f0a53a', '#5cbf5a', '#d95f93'];
const LETTERS = 'ABCD';
const NAMES = { nelore: 'NELORE', angus: 'ANGUS', f1: 'CRUZ. F1' };

// ---------- Utilidades ----------
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const rr = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const $ = id => document.getElementById(id);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ell(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fill(); }
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function txt(g, s, x, y, size, color, align = 'left', stroke = null) {
  g.font = `800 ${size}px "Trebuchet MS", "Segoe UI", sans-serif`;
  g.textAlign = align; g.textBaseline = 'alphabetic';
  if (stroke) { g.lineJoin = 'round'; g.lineWidth = Math.max(3, size / 5); g.strokeStyle = stroke; g.strokeText(s, x, y); }
  g.fillStyle = color; g.fillText(s, x, y);
}
function fitTxt(g, s, x, y, maxW, size, color, align = 'center') {
  g.font = `800 ${size}px "Trebuchet MS", sans-serif`;
  while (size > 8 && g.measureText(s).width > maxW) { size--; g.font = `800 ${size}px "Trebuchet MS", sans-serif`; }
  txt(g, s, x, y, size, color, align);
}

// ---------- Entrada: eixo horizontal modular ----------
/* inputAxisX vai de -1.0 (extrema esquerda) a +1.0 (extrema direita).
   Hoje é alimentado por teclado (A/D ou setas) e toque; o acelerômetro entra
   por updateFromAccelerometer(). Todo o resto do jogo lê somente inputAxisX. */
let inputAxisX = 0;
let keyDir = 0, touchDir = 0;
const keysDown = new Set();

const TILT_MAX = 30;     // graus de inclinação que equivalem a ±1.0 (gamma limitado a -30°..+30°)
const TILT_DEAD = 2;     // zona morta em graus (evita tremor com o aparelho parado)
let accelAxis = 0, accelStamp = -1e9, sensorSeen = false, sensorBound = false;

/**
 * Hook para o acelerômetro físico.
 * @param {number} tiltAngleX inclinação lateral em graus; negativo = esquerda, positivo = direita.
 * Chame a cada leitura do sensor (ou use enableTilt() para ligar o DeviceOrientationEvent).
 */
function updateFromAccelerometer(tiltAngleX) {
  const t = Math.abs(tiltAngleX) < TILT_DEAD ? 0 : tiltAngleX;
  accelAxis = clamp(t / TILT_MAX, -1, 1);
  accelStamp = performance.now();
}
window.updateFromAccelerometer = updateFromAccelerometer;

/* Liga o sensor do celular. `gamma` é a inclinação esquerda/direita com o aparelho
   em pé (retrato). No iOS a permissão só pode ser pedida a partir de um toque. */
function handleOrientation(e) {
  if (e.gamma == null) return;                       // computadores disparam o evento sem valores
  sensorSeen = true;
  updateFromAccelerometer(e.gamma);
}
async function enableTilt() {
  try {
    // iOS 13+ / Safari: a permissão só pode ser pedida dentro de um clique direto do usuário
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== 'granted') return false;
    }
    if (!sensorBound) { window.addEventListener('deviceorientation', handleOrientation); sensorBound = true; }
    return true;
  } catch (e) { return false; }
}
window.enableTilt = enableTilt;

// Prioridade: teclado > toque/arrasto > sensor. O sensor é amortecido (lerp exponencial) para não tremer.
function updateInput(dt) {
  const accelOn = performance.now() - accelStamp < 500;
  const manual = keyDir || (accelOn ? 0 : touchDir);
  if (manual) inputAxisX += clamp(manual - inputAxisX, -5 * dt, 5 * dt);
  else if (accelOn) inputAxisX += (accelAxis - inputAxisX) * (1 - Math.exp(-14 * dt));
  else inputAxisX += clamp(-inputAxisX, -6 * dt, 6 * dt);     // sem entrada: volta ao centro
}

addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keysDown.add('L'); e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keysDown.add('R'); e.preventDefault(); }
  else if ((k === 'Enter' || k === ' ') && state === 'roulette') { e.preventDefault(); spinRoulette(); }
  else if ((k === 'Enter' || k === ' ') && $('overlay').classList.contains('show')) { const b = $('go'); if (b) { e.preventDefault(); b.click(); } }
  keyDir = (keysDown.has('R') ? 1 : 0) - (keysDown.has('L') ? 1 : 0);
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keysDown.delete('L');
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keysDown.delete('R');
  keyDir = (keysDown.has('R') ? 1 : 0) - (keysDown.has('L') ? 1 : 0);
});
addEventListener('blur', () => { keysDown.clear(); keyDir = 0; touchDir = 0; });

// ---------- Fases ----------
function weightAway(cut, lo, hi, gap) { let w; do { w = rnd(lo, hi); } while (Math.abs(w - cut) < gap); return w; }
const PHASES = [
  { name: 'Leve ou Pesado', time: 65, count: 8, speed: 165,
    desc: 'Só o peso importa. Abaixo de 420 kg vai para a esquerda; 420 kg ou mais vai para a direita.',
    lanes: [
      { breed: 'Qualquer raça', range: '< 420 kg', test: a => a.w < 420 },
      { breed: 'Qualquer raça', range: '≥ 420 kg', test: a => a.w >= 420 }],
    make: () => ({ breed: pick(['nelore', 'angus', 'f1']), w: weightAway(420, 340, 500, 8) }) },
  { name: 'Raça e Peso', time: 80, count: 10, speed: 165,
    desc: 'Agora a raça conta: Angus à esquerda, Nelore leve (< 420 kg) no centro e Nelore pesado à direita.',
    lanes: [
      { breed: 'Angus', range: 'Qualquer peso', test: a => a.breed === 'angus' },
      { breed: 'Nelore', range: '< 420 kg', test: a => a.breed === 'nelore' && a.w < 420 },
      { breed: 'Nelore', range: '≥ 420 kg', test: a => a.breed === 'nelore' && a.w >= 420 }],
    make: () => { const breed = Math.random() < .34 ? 'angus' : 'nelore'; return { breed, w: weightAway(420, 330, 540, 8) }; } },
  { name: 'Pesagem Fina', time: 85, count: 12, speed: 190,
    desc: 'Quatro piquetes, boi mais veloz e Nelores com peso colado na linha de corte de 450 kg!',
    lanes: [
      { breed: 'Nelore', range: '< 450 kg', test: a => a.breed === 'nelore' && a.w < 450 },
      { breed: 'Nelore', range: '≥ 450 kg', test: a => a.breed === 'nelore' && a.w >= 450 },
      { breed: 'Angus', range: 'Qualquer peso', test: a => a.breed === 'angus' },
      { breed: 'Cruzamento F1', range: 'Qualquer peso', test: a => a.breed === 'f1' }],
    make: () => {
      const r = Math.random(), breed = r < .5 ? 'nelore' : r < .75 ? 'angus' : 'f1';
      return { breed, w: breed === 'nelore' ? 450 + pick([-1, 1]) * rnd(3, 14) : rnd(380, 560) };
    } },
];

// ---------- Estado ----------
let state = 'menu', phaseIdx = 0, ph = PHASES[0];
let animals = [], cur = null, spawned = 0, resolved = 0, spawnTimer = 0, finishTimer = 0;
let score = 0, phaseStartScore = 0, hits = 0, errs = 0, totHits = 0, totErrs = 0;
let stress = 0, timeLeft = 0, shake = 0, laneFlash = null;
let lives = START_LIVES, heartPulse = 0, roulette = null, flashRed = 0;
const parts = [], pops = [];

// ---------- Geometria dos piquetes ----------
// x da divisória i (0..n) na altura y: no topo do leque todas convergem para a saída da balança (300..420),
// na cabeça dos piquetes (FAN_BOT) abrem para a largura total.
function laneEdge(i, n, y) {
  const t = clamp((y - FAN_TOP) / (FAN_BOT - FAN_TOP), 0, 1);
  const xt = 300 + i * (120 / n), xb = LX + i * ((RX - LX) / n);
  return xt + (xb - xt) * t;
}
function laneAt(x, y, n) { for (let i = 0; i < n - 1; i++) if (x < laneEdge(i + 1, n, y)) return i; return n - 1; }
function lanePath(g, i, n) {
  g.beginPath();
  g.moveTo(laneEdge(i, n, FAN_TOP), FAN_TOP); g.lineTo(laneEdge(i + 1, n, FAN_TOP), FAN_TOP);
  g.lineTo(laneEdge(i + 1, n, FAN_BOT), FAN_BOT); g.lineTo(laneEdge(i + 1, n, FAN_BOT), END);
  g.lineTo(laneEdge(i, n, FAN_BOT), END); g.lineTo(laneEdge(i, n, FAN_BOT), FAN_BOT); g.closePath();
}

// ---------- Canvas e camadas pré-renderizadas ----------
const canvas = $('game'), g = canvas.getContext('2d');
let K = 1, layerBg = null, layerFg = null;

function makeLayer() {
  const c = document.createElement('canvas');
  c.width = Math.round(W * K); c.height = Math.round(H * K);
  const x = c.getContext('2d'); x.setTransform(K, 0, 0, K, 0, 0);
  return { c, x };
}
function buildLayers() {
  const a = makeLayer(); renderStatic(a.x); layerBg = a.c;
  const b = makeLayer(); renderRoof(b.x); layerFg = b.c;
}
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  K = Math.min(s * dpr, 2.2);
  canvas.style.width = Math.floor(W * s) + 'px'; canvas.style.height = Math.floor(H * s) + 'px';
  canvas.width = Math.round(W * K); canvas.height = Math.round(H * K);
  buildLayers();
}
addEventListener('resize', resize);

// Cerca de réguas de madeira vista de cima
function fences(x, segs) {
  x.lineCap = 'round';
  x.strokeStyle = 'rgba(0,0,0,.25)'; x.lineWidth = 9;
  for (const [x1, y1, x2, y2] of segs) { x.beginPath(); x.moveTo(x1 + 3, y1 + 4); x.lineTo(x2 + 3, y2 + 4); x.stroke(); }
  for (const [c, w, o] of [['#6b4020', 8, 0], ['#a8702f', 5, 0], ['#d6a15a', 1.6, -1]]) {
    x.strokeStyle = c; x.lineWidth = w;
    for (const [x1, y1, x2, y2] of segs) { x.beginPath(); x.moveTo(x1 + o, y1 + o); x.lineTo(x2 + o, y2 + o); x.stroke(); }
  }
  for (const [x1, y1, x2, y2] of segs) {
    const len = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.ceil(len / 40));
    for (let k = 0; k <= n; k++) {
      const px = lerp(x1, x2, k / n), py = lerp(y1, y2, k / n);
      x.fillStyle = '#3d230d'; x.fillRect(px - 7, py - 7, 14, 14);
      x.fillStyle = '#8a5a2b'; x.fillRect(px - 5, py - 5, 10, 10);
      x.fillStyle = '#b98650'; x.fillRect(px - 5, py - 5, 10, 3);
    }
  }
}

function tiles(x, rx, ry, w, h) {
  x.save(); rrect(x, rx, ry, w, h, 5); x.clip();
  x.fillStyle = '#c25a30'; x.fillRect(rx, ry, w, h);
  for (let yy = ry, row = 0; yy < ry + h; yy += 11, row++) {
    x.fillStyle = row % 2 ? '#b64d27' : '#cd6538'; x.fillRect(rx, yy, w, 11);
    x.fillStyle = 'rgba(60,20,5,.35)'; x.fillRect(rx, yy + 9, w, 2);
    for (let xx = rx + (row % 2) * 9; xx < rx + w; xx += 18) x.fillRect(xx, yy, 1.5, 9);
  }
  x.restore();
  x.strokeStyle = '#6e2a12'; x.lineWidth = 3; rrect(x, rx, ry, w, h, 5); x.stroke();
}

// Cobertura do galpão: telhas nas laterais e vigas frente/fundo; o centro fica aberto para ver o boi na balança
function renderRoof(x) {
  tiles(x, 175, 175, 125, 170); tiles(x, 420, 175, 125, 170);
  tiles(x, 175, 175, 370, 26); tiles(x, 175, 319, 370, 26);
  txt(x, 'BALANÇA', CX, 194, 17, '#fff0cf', 'center', '#5e2a10');
}

function renderStatic(x) {
  const rand = mulberry32(7), n = ph.lanes.length;
  // grama
  x.fillStyle = '#6aa84a'; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 1100; i++) {
    x.fillStyle = rand() < .5 ? 'rgba(40,100,40,.25)' : 'rgba(160,215,105,.25)';
    x.fillRect(rand() * W, rand() * H, 2, 5);
  }
  // terra batida do curral
  const dirt = [[170, 0], [300, 130], [300, FAN_TOP], [LX, FAN_BOT], [LX, END], [RX, END], [RX, FAN_BOT], [420, FAN_TOP], [420, 130], [550, 0]];
  const dirtPath = () => { x.beginPath(); dirt.forEach(([px, py], i) => i ? x.lineTo(px, py) : x.moveTo(px, py)); x.closePath(); };
  x.save(); dirtPath(); x.fillStyle = '#c9a06a'; x.fill(); x.clip();
  for (let i = 0; i < 80; i++) {
    const px = rand() * W, py = rand() * H, r = 30 + rand() * 70;
    const gr = x.createRadialGradient(px, py, 0, px, py, r);
    const c = rand() < .5 ? '120,80,40' : '245,215,160';
    gr.addColorStop(0, `rgba(${c},.14)`); gr.addColorStop(1, `rgba(${c},0)`);
    x.fillStyle = gr; x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  for (let i = 0; i < 2800; i++) {
    x.fillStyle = rand() < .5 ? 'rgba(110,70,30,.28)' : 'rgba(255,230,180,.3)';
    x.fillRect(rand() * W, rand() * H, 1 + rand() * 2, 1 + rand() * 2);
  }
  for (let i = 0; i < 90; i++) {
    x.fillStyle = rand() < .5 ? 'rgba(130,110,90,.55)' : 'rgba(90,70,50,.5)';
    ell(x, rand() * W, rand() * H, 2 + rand() * 3, 1.5 + rand() * 2.5, rand() * 3);
  }
  for (let i = 0; i < 26; i++) {           // pegadas no corredor
    const py = 20 + i * 24;
    x.fillStyle = 'rgba(90,60,30,.18)';
    ell(x, CX - 14 + rand() * 28, py, 5, 3); ell(x, CX - 14 + rand() * 28, py + 6, 5, 3);
  }
  x.restore();
  x.strokeStyle = 'rgba(90,60,30,.45)'; x.lineWidth = 7; dirtPath(); x.stroke();

  // árvores nas laterais
  const trees = [[70, 270], [115, 395], [60, 520], [650, 270], [605, 395], [660, 520], [95, 640], [625, 640]];
  for (const [tx, ty] of trees) {
    x.fillStyle = 'rgba(0,0,0,.22)'; ell(x, tx + 8, ty + 10, 42, 36);
    for (const [dx, dy, r, c] of [[0, 0, 40, '#2f7a34'], [-14, -10, 26, '#3b9140'], [14, 8, 24, '#378a3c'], [-6, -16, 14, '#58b256']]) { x.fillStyle = c; ell(x, tx + dx, ty + dy, r, r * .92); }
  }

  // setas pintadas no chão da manga
  x.fillStyle = 'rgba(90,55,25,.3)';
  txt(x, '▼  ENTRADA  ▼', CX, 100, 18, 'rgba(90,55,25,.38)', 'center');

  // fatias radiais dos piquetes
  for (let i = 0; i < n; i++) {
    lanePath(x, i, n);
    x.fillStyle = LANE_COLORS[i] + (i % 2 ? '26' : '1a'); x.fill();
  }
  x.setLineDash([10, 10]); x.strokeStyle = 'rgba(255,255,255,.45)'; x.lineWidth = 3;
  for (let i = 1; i < n; i++) { x.beginPath(); x.moveTo(laneEdge(i, n, FAN_TOP), FAN_TOP); x.lineTo(laneEdge(i, n, FAN_BOT), FAN_BOT); x.stroke(); }
  x.setLineDash([]);

  // plataforma da balança + sombra do telhado
  x.fillStyle = 'rgba(0,0,0,.22)'; x.fillRect(181, 183, 370, 170);
  x.fillStyle = '#a9783f'; x.fillRect(300, SCALE_Y0, 120, SCALE_Y1 - SCALE_Y0);

  const t = actx.currentTime + at, o = actx.createOscillator(), v = actx.createGain();
  o.type = type; o.frequency.value = freq;
  v.gain.setValueAtTime(.0001, t); v.gain.linearRampToValueAtTime(vol, t + .02); v.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(v); v.connect(actx.destination); o.start(t); o.stop(t + dur + .02);
}
let noiseBuf = null;
function noiseBurst(at, dur, freq, vol) {            // ruído filtrado: base dos passos
  if (!actx) return;

    noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * .2), actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = actx.currentTime + at, s = actx.createBufferSource(), f = actx.createBiquadFilter(), v = actx.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;

}

function dust(x, y, n = 1, c = '175,135,90', k = 'dust') {
  for (let i = 0; i < n; i++) parts.push({ k, x: x + rr(-8, 8), y, vx: rr(-25, 25), vy: rr(-20, 15), l: 0, m: rr(.5, .9), r: rr(5, 9), c });
}
function burstOk(x, y) {
  for (let i = 0; i < 34; i++) {
    const a = rr(0, TAU), sp = rr(80, 320);
    parts.push({ k: 'star', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, gv: 420, l: 0, m: rr(.8, 1.3), r: rr(5, 10),
      rot: rr(0, TAU), vr: rr(-8, 8), c: pick(['#3fbf4a', '#7fe26b', '#ffd84a', '#ffffff', '#2e9e44']) });
  }
}
function burstBad(x, y) {

  }
}
function popText(t, x, y, c) { pops.push({ t, x, y, c, l: 0, m: 1.1 }); }

function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.l += dt;
    if (p.l >= p.m) { parts.splice(i, 1); continue; }
    if (p.gv) p.vy += p.gv * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; if (p.vr) p.rot += p.vr * dt;
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i]; p.l += dt; p.y -= 50 * dt;
    if (p.l >= p.m) pops.splice(i, 1);

}
function star(x, cx, cy, r, rot) {
  x.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5, rad = i % 2 ? r * .45 : r; x.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); }
  x.closePath(); x.fill();
}
function drawParts(x, under) {
  for (const p of parts) {
    if ((p.k === 'dust') !== under) continue;
    const f = p.l / p.m;
    if (p.k === 'dust' || p.k === 'puff') {
      x.fillStyle = `rgba(${p.c},${(1 - f) * .5})`; x.beginPath(); x.arc(p.x, p.y, p.r * (1 + f), 0, TAU); x.fill();
    } else if (p.k === 'star') {
      x.globalAlpha = 1 - f * f; x.fillStyle = p.c; star(x, p.x, p.y, p.r, p.rot); x.globalAlpha = 1;
    } else if (p.k === 'steam') {
      x.fillStyle = `rgba(255,255,255,${(1 - f) * .75})`; x.beginPath(); x.arc(p.x, p.y, p.r * (1 + f * .8), 0, TAU); x.fill();
    } else if (p.k === 'txt') {

    }
  }
}

// ---------- Jogo ----------
function makeAnimal() {
  const base = ph.make();
  const a = Object.assign(base, {
    tone: Math.random() < .5 ? 'black' : 'red', x: CX, y: -40, vx: 0, phase: rr(0, TAU),
    lane: null, st: 'walk', weighT: 0, idle: 0, qT: 0, dustT: 0, steamT: 0,
  });
  a.correct = ph.lanes.findIndex(l => l.test(a));
  return a;
}

function startPhase(i) {
  phaseIdx = i; ph = PHASES[i];
  animals = []; cur = null; spawned = 0; resolved = 0; spawnTimer = .6; finishTimer = 0;
  hits = 0; errs = 0; stress = 0; timeLeft = ph.time; laneFlash = null; shake = 0;
  phaseStartScore = score;
  buildLayers();
  state = 'playing'; hide();
}

function updateAnimal(a, dt) {
  const n = ph.lanes.length;
  a.phase += ph.speed * dt * .05;
  if (a.st === 'walk') {
    a.vx += (inputAxisX * VMAX - a.vx) * Math.min(1, 7 * dt);
    a.x += a.vx * dt; a.y += ph.speed * dt;
  } else {
    a.vx = 0; a.y += ph.speed * .8 * dt;
  }
  // limites: manga/corredor, leque e (depois da cabeça dos piquetes) o corredor do piquete escolhido
  let L, R;
  if (a.y < FAN_TOP) { const hw = a.y >= 130 ? 60 : lerp(190, 60, clamp(a.y / 130, 0, 1)); L = CX - hw + HALF; R = CX + hw - HALF; }
  else if (a.y < FAN_BOT) { L = laneEdge(0, n, a.y) + HALF; R = laneEdge(n, n, a.y) - HALF; }
  else {
    if (a.lane === null) a.lane = laneAt(a.x, FAN_BOT, n);
    L = laneEdge(a.lane, n, FAN_BOT) + HALF; R = laneEdge(a.lane + 1, n, FAN_BOT) - HALF;
  }
  let blocked = false;
  if (a.x < L) { a.x = L; if (a.vx < 0) a.vx = 0; blocked = inputAxisX < -.3; }
  else if (a.x > R) { a.x = R; if (a.vx > 0) a.vx = 0; blocked = inputAxisX > .3; }
  if (blocked && a.st === 'walk' && a.y < FAN_TOP && a.y > 0) {     // encostou na cerca da manga/balança
    stress = Math.min(1, stress + .55 * dt);
    a.bump = (a.bump || 0) + dt;
    if (a.bump > .12) { a.bump = 0; dust(a.x + (a.x < CX ? -22 : 22), a.y, 1, '150,110,70'); }
    a.blockedNow = true;
  } else a.blockedNow = false;

  if (a.st === 'walk' && a.weighT > 0 || a.y >= SCALE_Y0 + 10 && a.st === 'walk') a.weighT += dt;   // pesando na balança
  if (a.weighT > 0 && !a.wStart) { a.wStart = true; sfxWeigh(); }
  if (a.weighT >= WEIGH_T && !a.wDone) { a.wDone = true; tone(1250, 0, .2, 'sine', .22); }          // bip: peso fechado

  // poeira atrás do boi
  a.dustT -= dt;
  if (a.dustT <= 0 && a.y > 0) { a.dustT = .07; dust(a.x, a.y - 44, 1); }

  if (a === cur) {
    const si = Math.floor(a.phase * 2 / Math.PI);                    // um passo a cada meio ciclo das patas
    if (si !== a.stepIdx) { a.stepIdx = si; if (a.y > 0) sfxStep(); }
    // hesitação: no leque, sem guiar, saem pontos de interrogação
    const head = a.y + 58;
    if (a.y > FAN_TOP + 5 && a.y < FAN_BOT && Math.abs(inputAxisX) < .12) a.idle += dt; else a.idle = Math.max(0, a.idle - dt * 2);
    if (a.idle > 1.2) { a.qT -= dt; if (a.qT <= 0) { a.qT = .5; parts.push({ k: 'txt', t: '?', x: a.x + rr(-14, 14), y: head, vx: rr(-10, 10), vy: -45, l: 0, m: 1.0 }); } }
    // vapor de estresse
    if (stress > .85) { a.steamT -= dt; if (a.steamT <= 0) { a.steamT = .12; parts.push({ k: 'steam', x: a.x + rr(-10, 10), y: head, vx: rr(-15, 15), vy: -60, l: 0, m: .7, r: rr(4, 8) }); } }
    if (a.y >= GATE) resolve(a);
  }
}

function resolve(a) {
  const ok = a.lane === a.correct;
  a.st = 'exit'; cur = null; resolved++;
  const n = ph.lanes.length, lx = (laneEdge(a.lane, n, FAN_BOT) + laneEdge(a.lane + 1, n, FAN_BOT)) / 2;
  if (ok) {
    score += POINTS; hits++; totHits++; sfxOk(); burstOk(a.x, a.y); popText('+' + POINTS, lx, GATE - 30, '#45c64d');
  } else {
    errs++; totErrs++; sfxBad(); burstBad(a.x, a.y); shake = .3; popText('−1 vida', lx, GATE - 30, '#ee4d3a');
    loseLife();
  }
  laneFlash = { i: a.lane, ok, t: .7 };
  if (state !== 'playing') return;                                  // acabaram as vidas: a roleta assume
  if (resolved >= ph.count) finishTimer = 1.1; else spawnTimer = .35;
}

function resetGame() { score = 0; lives = START_LIVES; totHits = 0; totErrs = 0; stress = 0; roulette = null; heartPulse = 0; flashRed = 0; }

// Perde 1 vida; ao zerar, interrompe a partida e abre a roleta
function loseLife() {
  if (lives <= 0) return;
  lives--; heartPulse = 1;
  try { if (navigator.vibrate) navigator.vibrate(200); } catch (e) {}      // háptico no celular
  if (lives <= 0) startRoulette();
}

function update(dt) {
  updateInput(dt);
  if (state === 'roulette') { updateRoulette(dt); return; }
  updateParts(dt);
  shake = Math.max(0, shake - dt);
  heartPulse = Math.max(0, heartPulse - dt * 1.5);
  if (laneFlash) { laneFlash.t -= dt; if (laneFlash.t <= 0) laneFlash = null; }
  if (state !== 'playing') return;

  const finishing = resolved >= ph.count;
  if (!finishing) {
    timeLeft -= dt;
    if (timeLeft <= 0) {                                            // tempo da fase estourou: -1 vida e mais um fôlego
      timeLeft = TIME_RESET; popText('TEMPO! −1 vida', CX, 420, '#ee4d3a'); sfxBad(); shake = .25;
      loseLife(); if (state !== 'playing') return;
    }
  }
  if (!cur && spawned < ph.count) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) { const a = makeAnimal(); animals.push(a); cur = a; spawned++; }
  }
  let blockedAny = false;
  for (const a of animals) { updateAnimal(a, dt); if (a.blockedNow) blockedAny = true; }
  if (!blockedAny) stress = Math.max(0, stress - .12 * dt);
  if (stress >= 1) {                                                // boi travado na cerca: -1 vida
    stress = .3; popText('TRAVOU! −1 vida', CX, 300, '#ee4d3a'); sfxBad(); shake = .25;
    loseLife(); if (state !== 'playing') return;
  }
  animals = animals.filter(a => a.st === 'walk' || a.y < END - 10);
  if (finishTimer > 0) { finishTimer -= dt; if (finishTimer <= 0) endPhase(); }
}

// ---------- Desenho ----------
function draw() {
  g.setTransform(K, 0, 0, K, 0, 0);
  g.clearRect(0, 0, W, H);
  g.save();
  if (shake > 0) g.translate(rr(-1, 1) * shake * 14, rr(-1, 1) * shake * 14);
  if (layerBg) g.drawImage(layerBg, 0, 0, W, H);

  const n = ph.lanes.length;
  if (cur && cur.y > FAN_TOP - 30 && cur.y < GATE) {              // realça o piquete sobre o qual o boi está
    const li = cur.y < FAN_BOT ? laneAt(cur.x, cur.y, n) : (cur.lane ?? laneAt(cur.x, FAN_BOT, n));
    lanePath(g, li, n); g.fillStyle = LANE_COLORS[li]; g.globalAlpha = .18 + .08 * Math.sin(performance.now() / 150); g.fill(); g.globalAlpha = 1;
  }
  if (laneFlash) { lanePath(g, laneFlash.i, n); g.fillStyle = laneFlash.ok ? '#3fbf4a' : '#e8372a'; g.globalAlpha = clamp(laneFlash.t, 0, .7) * .7; g.fill(); g.globalAlpha = 1; }

  drawParts(g, true);
  for (const a of animals.slice().sort((p, q) => p.y - q.y)) {
    if (a.y < -90) continue;
    drawCow(g, a, a.st === 'exit' ? clamp((END - 10 - a.y) / 70, 0, 1) : 1);
  }
  if (layerFg) g.drawImage(layerFg, 0, 0, W, H);
  if (cur) drawTag(g, cur);
  if (state === 'roulette') drawRoulette(g); else drawFx(g);
  g.restore();
  if (state === 'playing') drawHud(g);
}

function drawFx(x) {                                               // partículas e textos por cima de tudo
  drawParts(x, false);
  for (const p of pops) {
    x.globalAlpha = clamp(1 - (p.l / p.m) * (p.l / p.m), 0, 1);
    txt(x, p.t, p.x, p.y, 42, p.c, 'center', '#ffffff'); x.globalAlpha = 1;
  }
}

// ---------- Roleta "Tudo ou Nada" ----------
const SA = TAU / 8, RCY = 450, RR = 200;
const SLICES = [                       // 5 multiplicadores + 3 "perde tudo", intercalados
  { v: 1.5, t: 'x1.5', c: '#3fa84a' }, { v: 0, c: '#c62d24' },
  { v: 2,   t: 'x2',   c: '#f2c230' }, { v: 0, c: '#1b1b1f' },
  { v: 3,   t: 'x3',   c: '#2f8f3a' }, { v: 0, c: '#c62d24' },
  { v: 5,   t: 'x5',   c: '#e39b17' }, { v: 2, t: 'x2', c: '#4fbf5a' },
];

function startRoulette() {
  state = 'roulette'; hide(); cur = null; touchDir = 0; laneFlash = null; stress = 0;
  roulette = { st: 'ready', th: -Math.PI / 2 - SA * .5, th0: 0, D: 0, t: 0, ptr: 0, target: 0, resT: 0, from: Math.round(score), shown: Math.round(score) };
  roulette.lastIdx = Math.floor((-Math.PI / 2 - roulette.th) / SA);
  sfxBuzz();
}

// Sorteia a fatia e calcula quanto a roda deve girar para parar exatamente nela (com folga aleatória dentro da fatia)
function spinRoulette() {
  const r = roulette;
  if (state !== 'roulette' || !r || r.st !== 'ready') return;
  ensureAudio();
  r.target = rnd(0, SLICES.length - 1);
  const thf = -Math.PI / 2 - (r.target + .5) * SA + rr(-.35, .35) * SA;   // o ponteiro fica no topo (-90°)
  r.th0 = r.th; r.D = (((thf - r.th) % TAU) + TAU) % TAU + TAU * 6;     // ao menos 6 voltas
  r.st = 'spin'; r.t = 0;
}

function updateRoulette(dt) {
  updateParts(dt);
  shake = Math.max(0, shake - dt); flashRed = Math.max(0, flashRed - dt);
  const r = roulette; r.ptr = Math.max(0, r.ptr - dt * 5);
  if (r.st === 'spin') {
    r.t += dt;
    // atrito: velocidade cai exponencialmente; normalizado para chegar exatamente no destino em T segundos
    const tau = 1.15, T = 7.5, f = (1 - Math.exp(-Math.min(r.t, T) / tau)) / (1 - Math.exp(-T / tau));
    r.th = r.th0 + r.D * f;
    const idx = Math.floor((-Math.PI / 2 - r.th) / SA);                 // pino passando pelo ponteiro
    if (idx !== r.lastIdx) { r.lastIdx = idx; r.ptr = .5; sfxTick(); }
    if (r.t >= T) finishSpin();
  } else if (r.st === 'result') {
    r.resT += dt;
    r.shown = Math.round(lerp(r.from, score, clamp(r.resT, 0, 1)));
    if (r.resT > 3.2) { r.st = 'done'; showGameOver(false); }
  }
}

function finishSpin() {
  const r = roulette, s = SLICES[r.target];
  r.st = 'result'; r.resT = 0; r.from = Math.round(score);
  if (s.v === 0) { score = 0; sfxSiren(); flashRed = 2; shake = .6; for (let i = 0; i < 4; i++) burstBad(rr(180, 540), rr(300, 560)); }
  else { score = Math.round(score * s.v); sfxWin(); for (let i = 0; i < 5; i++) burstOk(rr(160, 560), rr(280, 560)); }
}

function skull(x, s) {
  x.fillStyle = '#f4efe4'; x.beginPath(); x.arc(0, -4 * s, 17 * s, 0, TAU); x.fill();
  rrect(x, -9 * s, 6 * s, 18 * s, 13 * s, 3 * s); x.fill();
  x.fillStyle = '#111'; ell(x, -6.5 * s, -4 * s, 4.5 * s, 5.5 * s); ell(x, 6.5 * s, -4 * s, 4.5 * s, 5.5 * s);
  x.beginPath(); x.moveTo(0, 2 * s); x.lineTo(-2.5 * s, 7 * s); x.lineTo(2.5 * s, 7 * s); x.closePath(); x.fill();
  x.strokeStyle = '#111'; x.lineWidth = 1.5 * s;
  for (const dx of [-4, 0, 4]) { x.beginPath(); x.moveTo(dx * s, 11 * s); x.lineTo(dx * s, 18 * s); x.stroke(); }
}

function drawRoulette(x) {
  const r = roulette, res = r.st === 'result' || r.st === 'done', win = SLICES[r.target].v > 0;
  x.fillStyle = 'rgba(10,5,0,.74)'; x.fillRect(0, 0, W, H);
  if (flashRed > 0) { x.fillStyle = `rgba(230,30,20,${flashRed * .16 * (.6 + .4 * Math.sin(performance.now() / 90))})`; x.fillRect(0, 0, W, H); }

  txt(x, 'TUDO OU NADA', CX, 64, 46, '#ffd84a', 'center', '#5e2a10');
  panel(x, 150, 84, 420, 104);
  txt(x, 'PONTUAÇÃO ACUMULADA', CX, 112, 14, '#f3d9a4', 'center');
  txt(x, String(r.shown), CX, 168, 52, res ? (win ? '#9dff8a' : '#ff6a4d') : '#fff', 'center');

  x.save(); x.translate(CX, RCY);
  x.fillStyle = 'rgba(0,0,0,.4)'; x.beginPath(); x.arc(6, 10, RR + 26, 0, TAU); x.fill();
  x.fillStyle = '#5e3a1a'; x.beginPath(); x.arc(0, 0, RR + 24, 0, TAU); x.fill();
  x.fillStyle = '#8a5a2b'; x.beginPath(); x.arc(0, 0, RR + 16, 0, TAU); x.fill();
  x.rotate(r.th);
  SLICES.forEach((s, i) => {
    x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, RR, i * SA, (i + 1) * SA); x.closePath();
    x.fillStyle = s.c; x.fill(); x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = 3; x.stroke();
    x.save(); x.rotate((i + .5) * SA); x.translate(RR * .66, 0); x.rotate(Math.PI / 2);
    if (s.v) txt(x, s.t, 0, 13, 38, '#fff', 'center', 'rgba(0,0,0,.65)');
    else { skull(x, 1.15); txt(x, '0', 0, 46, 24, '#fff', 'center', 'rgba(0,0,0,.7)'); }
    x.restore();
  });
  for (let i = 0; i < SLICES.length; i++) {                             // pinos dourados nas divisórias
    const a = i * SA;
    x.fillStyle = '#ffd84a'; x.beginPath(); x.arc(Math.cos(a) * (RR + 3), Math.sin(a) * (RR + 3), 8, 0, TAU); x.fill();
    x.strokeStyle = '#8a5a00'; x.lineWidth = 2; x.stroke();
  }
  x.restore();

  x.save(); x.translate(CX, RCY);                                       // cubo central
  x.fillStyle = '#5e3a1a'; x.beginPath(); x.arc(0, 0, 36, 0, TAU); x.fill();
  x.fillStyle = '#ffd84a'; x.beginPath(); x.arc(0, 0, 26, 0, TAU); x.fill();
  x.fillStyle = '#8a5a2b'; x.beginPath(); x.arc(0, 0, 14, 0, TAU); x.fill();
  x.restore();

  x.save(); x.translate(CX, RCY - RR - 30); x.rotate(r.ptr * .5);       // ponteiro: é empurrado pelos pinos
  x.fillStyle = '#e02b20'; x.strokeStyle = '#4a0d08'; x.lineWidth = 4;
  x.beginPath(); x.moveTo(-17, -14); x.lineTo(17, -14); x.lineTo(0, 48); x.closePath(); x.fill(); x.stroke();
  x.fillStyle = '#ffd84a'; x.beginPath(); x.arc(0, -8, 7, 0, TAU); x.fill();
  x.restore();

  if (r.st === 'ready') {
    const sc = 1 + .04 * Math.sin(performance.now() / 160);
    x.save(); x.translate(CX, 768); x.scale(sc, sc);
    x.fillStyle = 'rgba(0,0,0,.35)'; rrect(x, -148, -34, 300, 76, 18); x.fill();
    x.fillStyle = '#3f9e3a'; rrect(x, -150, -38, 300, 76, 18); x.fill();
    x.strokeStyle = '#266b24'; x.lineWidth = 5; rrect(x, -150, -38, 300, 76, 18); x.stroke();
    txt(x, 'GIRAR ROLETA', 0, 11, 32, '#fff', 'center', '#266b24');
    x.restore();
    txt(x, 'toque no botão ou aperte Enter', CX, 830, 14, '#f3d9a4', 'center');
  } else if (r.st === 'spin') {
    txt(x, 'Girando…', CX, 780, 32, '#fff0cf', 'center', '#3d230d');
  } else {
    const s = SLICES[r.target];
    txt(x, win ? `${s.t.toUpperCase()}!  PONTOS MULTIPLICADOS` : 'FALÊNCIA! PERDEU TUDO', CX, 780, win ? 28 : 34, win ? '#9dff8a' : '#ff6a4d', 'center', '#2b0d08');
  }
  drawFx(x);
}

// ---------- Telas (HTML sobre o canvas) ----------
function show(html) { $('card').innerHTML = html; $('overlay').classList.add('show'); }
function hide() { $('overlay').classList.remove('show'); }
let controlNote = '';

function showMenu() {
  state = 'menu'; resetGame(); phaseIdx = 0; ph = PHASES[0]; animals = []; cur = null; buildLayers();
  show(`<h1>🐂 Mestre do Confinamento</h1>
    <p class="sub"><b>Mobile Tilt Edition</b> · guie cada boi até o piquete certo antes que o tempo acabe.</p>
    <p>O boi desce sozinho pela manga, é pesado na balança e segue para os piquetes. Você controla só o <b>desvio lateral</b>:</p>
    <p><b>📱 Incline o celular</b> para a esquerda ou direita (segure em pé).</p>
    <p class="sub">Sem sensor ou no computador: <b>arraste o dedo</b> na tela ou use <kbd>←</kbd> <kbd>→</kbd> / <b>A</b> <b>D</b>.</p>
    <p>Confira <b>raça</b> e <b>peso</b> com a placa de cada piquete. Acerto: <b>+100</b> pontos.</p>
    <p>Você tem <b>5 vidas ❤</b>. Piquete errado, boi travado na cerca ou tempo estourado custam <b>1 vida</b>. Zerou? Rola a <b>roleta Tudo ou Nada</b> com a sua pontuação!</p>
    <button class="go" id="go">Iniciar Manejo</button>`);
  // enableTilt() é chamado primeiro, ainda dentro do clique: o iOS exige isso para liberar o sensor
  $('go').onclick = async () => {
    ensureAudio();
    const granted = await enableTilt();
    if (granted) await new Promise(r => setTimeout(r, 350));            // dá tempo da 1ª leitura do sensor chegar
    controlNote = granted ? '' : 'Permissão do sensor negada: use o arrastar do dedo ou as setas.';
    showIntro(0);
  };
}

function showIntro(i) {
  phaseIdx = i; ph = PHASES[i]; buildLayers(); state = 'intro';
  show(`<h2>Fase ${i + 1} · ${ph.name}</h2>
    <p>${ph.desc}</p>
    <div class="lanes">${ph.lanes.map((l, k) => `<div class="chip"><b style="background:${LANE_COLORS[k]}">PIQUETE ${LETTERS[k]}</b><span>${l.breed}<br>${l.range}</span></div>`).join('')}</div>
    <p class="sub">${ph.count} animais · ${ph.time} segundos</p>
    <p class="sub">${sensorSeen ? '✔ Inclinação do celular ativada.' : (controlNote || 'Sem sensor de inclinação: arraste o dedo ou use ← →.')}</p>
    <button class="go" id="go">Bora!</button>`);
  $('go').onclick = () => { ensureAudio(); startPhase(i); };
}

function stars(h, e) { const acc = h / Math.max(1, h + e); return acc >= .9 ? 3 : acc >= .7 ? 2 : 1; }

function endPhase() {
  sfxPhase();
  const last = phaseIdx === PHASES.length - 1;
  if (!last) {
    state = 'phaseDone';
    show(`<h2>Fase ${phaseIdx + 1} concluída! 🎉</h2>
      <div class="stats"><div><i>${hits}</i>acertos</div><div><i>${errs}</i>erros</div><div><i>${Math.round(score)}</i>pontos</div><div><i>${lives}</i>vidas</div></div>
      <button class="go" id="go">Próxima fase</button>`);
    $('go').onclick = () => showIntro(phaseIdx + 1);
  } else {
    showGameOver(true);
  }
}

// Tela final: vitória (3 fases concluídas) ou derrota (vidas zeradas e roleta já resolvida)
function showGameOver(won) {
  state = 'gameover';
  show(`<h1>${won ? 'Lote finalizado! 🏆' : 'Game Over'}</h1>
    <p class="sub">${won ? 'Você separou o gado das 3 fases com vidas de sobra.' : 'As 5 vidas acabaram.'}</p>
    <div class="stats"><div><i>${Math.round(score)}</i>pontuação final</div><div><i>${totHits}</i>cabeças triadas</div><div><i>${totErrs}</i>erros</div></div>
    <button class="go" id="go">Jogar Novamente</button>`);
  $('go').onclick = () => { ensureAudio(); resetGame(); showIntro(0); };
}


// ---------- Toque (metade esquerda / direita) ----------
// Toque/arrasto: um toque simples puxa para o lado tocado; arrastando, o deslocamento do dedo vira o eixo (-1..+1)
let pressed = false, dragX0 = 0, dragMoved = false;
function setTouch(e) {
  const r = canvas.getBoundingClientRect(), dx = e.clientX - dragX0;
  if (Math.abs(dx) > 14) dragMoved = true;
  touchDir = dragMoved ? clamp(dx / (r.width * .18), -1, 1) : ((e.clientX - r.left) / r.width < .5 ? -1 : 1);
}
canvas.addEventListener('pointerdown', e => {
  if (state === 'roulette') {                                         // botão "GIRAR ROLETA"
    const r = canvas.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W, py = (e.clientY - r.top) / r.height * H;
    if (px > 200 && px < 520 && py > 720 && py < 820) spinRoulette();
    return;
  }
  if (state === 'playing') { pressed = true; dragMoved = false; dragX0 = e.clientX; setTouch(e); canvas.setPointerCapture(e.pointerId); }
});
canvas.addEventListener('pointermove', e => { if (pressed) setTouch(e); });
for (const ev of ['pointerup', 'pointercancel']) canvas.addEventListener(ev, () => { pressed = false; touchDir = 0; });

// Nível de bolha (HTML): a bolha acompanha inputAxisX, o número mostra os graus equivalentes
const levelEl = $('level'), bubbleEl = $('bubble'), degEl = $('deg');
let lastDeg = null;
function updateLevel() {
  levelEl.classList.toggle('on', state === 'playing');
  if (state !== 'playing') return;
  const track = (bubbleEl.parentElement.clientWidth || 200) / 2 - 12;
  bubbleEl.style.transform = `translateX(${(inputAxisX * track).toFixed(1)}px)`;
  const deg = Math.round(inputAxisX * TILT_MAX);
  if (deg !== lastDeg) { lastDeg = deg; degEl.textContent = (deg > 0 ? '+' : '') + deg + '°'; }
}

// ---------- Loop principal (requestAnimationFrame, ~60 FPS) ----------
let lastTs = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - lastTs) / 1000 || 0); lastTs = ts;
  update(dt); draw(); updateLevel();
  requestAnimationFrame(frame);
}

resize();
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
