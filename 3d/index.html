<style>
  :root { --ink: #2b2118; --cream: #fff6e0; --wood: #8a5a2b; --wood-dark: #5e3a1a; --green: #3f9e3a; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #a8d3ee;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: var(--ink);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  a { color: var(--wood-dark); } a:hover { color: var(--wood); }
  #view, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(25,15,5,.45); padding: 16px; z-index: 5;
  }
  #overlay.show { display: flex; }
  #toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -80px); z-index: 9; padding: 8px 16px; border-radius: 12px;
    background: var(--wood-dark); color: #fff0cf; font-weight: 800; font-size: 15px; transition: transform .25s; pointer-events: none; }
  #toast.show { transform: translate(-50%, 0); }
  .card {
    background: var(--cream); border: 6px solid var(--wood); border-radius: 18px;
    box-shadow: 0 0 0 4px var(--wood-dark), 0 14px 40px rgba(0,0,0,.55);
    width: min(520px, 100%); max-height: 100%; overflow: auto; padding: 22px 24px; text-align: center;
  }
  .card h1 { margin: 0 0 4px; font-size: 30px; color: var(--wood-dark); line-height: 1.1; }
  .card h2 { margin: 0 0 6px; font-size: 24px; color: var(--wood-dark); }
  .card p { margin: 8px 0; font-size: 16px; line-height: 1.4; text-wrap: pretty; }
  .card .sub { color: #7a6a52; font-size: 14px; }
  .keys { display: flex; gap: 10px; justify-content: center; margin: 12px 0 4px; flex-wrap: wrap; }
  kbd {
    display: inline-block; min-width: 44px; padding: 6px 12px; border-radius: 8px; font: 800 20px "Trebuchet MS", sans-serif;
    background: #fff; border: 2px solid var(--wood-dark); border-bottom-width: 5px; color: var(--wood-dark);
  }
  .lanes { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 12px 0; }
  .chip { flex: 1 1 100px; max-width: 140px; border-radius: 10px; border: 3px solid var(--wood-dark); background: #fff; overflow: hidden; font-size: 13px; }
  .chip b { display: block; color: #fff; padding: 4px 2px; font-size: 14px; letter-spacing: .5px; }
  .chip span { display: block; padding: 5px 4px; font-weight: 700; line-height: 1.25; }
  .stats { display: flex; justify-content: center; gap: 22px; margin: 12px 0; font-weight: 700; flex-wrap: wrap; }
  .stats i { display: block; font: 800 28px "Trebuchet MS", sans-serif; font-style: normal; }
  button.go {
    margin-top: 10px; padding: 12px 30px; font: 800 20px "Trebuchet MS", sans-serif; color: #fff; cursor: pointer;
    background: var(--green); border: 3px solid #266b24; border-bottom-width: 6px; border-radius: 14px;
  }
  button.go:active { transform: translateY(3px); border-bottom-width: 3px; }
  .brand { display: inline-block; background: #0D227F; border-radius: 12px; padding: 9px 20px; margin-bottom: 8px; border-bottom: 4px solid #FFBB00; }
  .brand img { display: block; height: 46px; }
  .wa { display: flex; gap: 14px; align-items: center; justify-content: center; text-align: left; margin: 12px 0 4px; }
  .wa svg { flex: none; background: #fff; border-radius: 8px; border: 3px solid #0D227F; }
  .wa p { margin: 0; font-size: 15px; }
  button.alt { background: #8a7a62; border-color: #5e5240; font-size: 15px; padding: 8px 16px; margin-left: 8px; }
</style>
</head>

<canvas id="view"></canvas>

<div id="toast" role="status"></div>
<div id="overlay"><div class="card" id="card"></div></div>

/* MESTRE DO CONFINAMENTO 3D
   A lógica roda no mesmo plano lógico 720 x 960 do jogo original (x lateral, y = avanço).
   O mundo 3D mapeia 100 px lógicos = 1 m: WX(x) lateral (espelhado p/ câmera atrás do boi), WZ(y) profundidade. */
import * as THREE from 'three';

const W = 720, H = 960, CX = 360;
const FAN_TOP = 340, FAN_BOT = 700, GATE = 790, END = 940, LX = 20, RX = 700;
const SCALE_Y0 = 195, SCALE_Y1 = 335, HALF = 26, VMAX = 300, POINTS = 100, WEIGH_T = 0.8;
const START_LIVES = 2, TIME_RESET = 15, TAU = Math.PI * 2;
const LANE_COLORS = ['#3b9be0', '#f0a53a', '#5cbf5a', '#d95f93'];
const LETTERS = 'ABCD';
const NAMES = { nelore: 'NELORE', angus: 'ANGUS', f1: 'CRUZ. F1' };

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const rr = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const $ = id => document.getElementById(id);
const WX = x => (CX - x) / 100, WZ = y => (y - 480) / 100;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ell(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fill(); }
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function txt(g, s, x, y, size, color, align = 'left', stroke = null) {
  g.font = `800 ${size}px "Trebuchet MS", "Segoe UI", sans-serif`;
  g.textAlign = align; g.textBaseline = 'alphabetic';
  if (stroke) { g.lineJoin = 'round'; g.lineWidth = Math.max(3, size / 5); g.strokeStyle = stroke; g.strokeText(s, x, y); }
  g.fillStyle = color; g.fillText(s, x, y);
}
function fitTxt(g, s, x, y, maxW, size, color, align = 'center') {
  g.font = `800 ${size}px "Trebuchet MS", sans-serif`;
  while (size > 8 && g.measureText(s).width > maxW) { size--; g.font = `800 ${size}px "Trebuchet MS", sans-serif`; }
  txt(g, s, x, y, size, color, align);
}

// ---------- Brindes (cota diária) ----------
// Por dia: 3 bonés, 3 mouse pads e 30 chaveiros. Os 36 brindes são "liberados" em horários aleatórios dentro da janela abaixo;
// quando um giro cai num horário liberado, ainda há um sorteio de chance (baixa nas fases iniciais) e o tipo é sorteado entre os que estão permitidos naquele momento:
//   • chaveiro: sempre;
//   • mouse pad: só para quem chegou à 2ª fase ou mais, e nunca é o primeiro brinde do dia;
//   • boné: só para quem chegou à 3ª fase, e só depois de 5 chaveiros e 1 mouse pad já entregues no dia.
// Nunca saem dois giros premiados seguidos.
const PRIZES = {
  bone:  { n: 'Boné',      short: 'BONÉ',      emoji: '🧢', qty: 3 },
  mouse: { n: 'Mouse pad', short: 'MOUSE PAD', emoji: '🖱️', qty: 3 },
  key:   { n: 'Chaveiro',  short: 'CHAVEIRO',  emoji: '🔑', qty: 30 },
};
const PRIZE_FROM = 10, PRIZE_TO = 17;       // janela diária de distribuição (horas)
// Chance base de ganhar conforme até onde o jogador chegou (1ª, 2ª, 3ª fase, ou terminou o jogo).
// Se brindes liberados pelo horário estiverem acumulados sem sair, a chance sobe um pouco (até 3x) para a cota fechar no dia.
const WIN_CHANCE = [.04, .18, .40, .85], CATCHUP_STEP = .35, CATCHUP_MAX = 3;
const BONE_MIN_KEYS = 5, BONE_MIN_MOUSE = 1;
let prizeMem = null;
function dayKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function buildPlan(prev) {
  // o que não saiu no dia anterior é somado à cota do novo dia
  const qty = {};
  for (const k in PRIZES) { const old = prev && prev.qty ? prev.qty[k] : PRIZES[k].qty; qty[k] = PRIZES[k].qty + (prev && prev.given ? Math.max(0, old - prev.given[k]) : 0); }
  const N = Object.values(qty).reduce((a, v) => a + v, 0);
  const d = new Date(), t0 = new Date(d.getFullYear(), d.getMonth(), d.getDate(), PRIZE_FROM).getTime(), span = (PRIZE_TO - PRIZE_FROM) * 3600e3;
  const slots = [];
  for (let i = 0; i < N; i++) slots.push(Math.round(t0 + (i + rr(.1, .9)) * span / N));
  return { v: 2, day: dayKey(), qty, slots, next: 0, since: 9, given: { bone: 0, mouse: 0, key: 0 } };
}
function loadPrizes() {
  let st = prizeMem;
  try { const raw = localStorage.getItem('mc_brindes2'); if (raw) st = JSON.parse(raw); } catch (e) {}
  if (!st || st.v !== 2) st = buildPlan();
  else if (st.day !== dayKey()) st = buildPlan(st);
  if (!st.qty) st.qty = { bone: PRIZES.bone.qty, mouse: PRIZES.mouse.qty, key: PRIZES.key.qty };
  return st;
}
function savePrizes(st) { prizeMem = st; try { localStorage.setItem('mc_brindes2', JSON.stringify(st)); } catch (e) {} }
function eligiblePrizes(st, stage) {
  const g = st.given, total = g.bone + g.mouse + g.key, out = [];
  if (g.key < st.qty.key) out.push(['key', st.qty.key - g.key]);
  if (stage >= 2 && total >= 1 && g.mouse < st.qty.mouse) out.push(['mouse', (st.qty.mouse - g.mouse) * 2]);
  if (stage >= 3 && g.key >= BONE_MIN_KEYS && g.mouse >= BONE_MIN_MOUSE && g.bone < st.qty.bone) out.push(['bone', (st.qty.bone - g.bone) * 2]);
  return out;
}
function awardPrize(stage) {      // stage: 1, 2, 3 = fase em que o jogador parou; 4 = terminou o jogo
  const st = loadPrizes(); let type = null;
  if (st.next < st.slots.length && st.slots[st.next] <= Date.now() && st.since >= 1) {
    const el = eligiblePrizes(st, stage), now = Date.now();
    let due = 0; for (let i = st.next; i < st.slots.length && st.slots[i] <= now; i++) due++;
    const chance = Math.min(1, WIN_CHANCE[stage - 1] * Math.min(CATCHUP_MAX, 1 + CATCHUP_STEP * (due - 1)));
    if (el.length && Math.random() < chance) {
      let r = Math.random() * el.reduce((a, e) => a + e[1], 0);
      for (const [k, w] of el) { if ((r -= w) < 0) { type = k; break; } }
      type = type || el[0][0];
    }

  if (type) { st.next++; st.given[type]++; st.since = 0; } else st.since++;

}
function prizeStats() {
  const st = loadPrizes(); savePrizes(st);

}

  x.fillStyle = '#8a5a2b'; x.beginPath(); x.arc(0, 0, RR + 16, 0, TAU); x.fill();
  x.rotate(r.th);
  SLICES.forEach((s, i) => {
    x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, RR, i * SA, (i + 1) * SA); x.closePath();
    x.fillStyle = s.c; x.fill(); x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = 3; x.stroke();
    x.save(); x.rotate((i + .5) * SA); x.translate(RR * .66, 0); x.rotate(Math.PI / 2);
    if (s.p) { txt(x, PRIZES[s.p].emoji, 0, 6, 40, '#fff', 'center'); txt(x, PRIZES[s.p].short, 0, 32, 15, '#fff', 'center', 'rgba(0,0,0,.65)'); }
    else txt(x, 'QUASE!', 0, 8, 20, '#fff', 'center', 'rgba(0,0,0,.6)');
    x.restore();
  });
  for (let i = 0; i < SLICES.length; i++) {
    const a = i * SA;
    x.fillStyle = '#ffd84a'; x.beginPath(); x.arc(Math.cos(a) * (RR + 3), Math.sin(a) * (RR + 3), 8, 0, TAU); x.fill();
    x.strokeStyle = '#8a5a00'; x.lineWidth = 2; x.stroke();
  }
  x.restore();
  x.save(); x.translate(CX, RCY);
  x.fillStyle = '#5e3a1a'; x.beginPath(); x.arc(0, 0, 36, 0, TAU); x.fill();
  x.fillStyle = '#ffd84a'; x.beginPath(); x.arc(0, 0, 26, 0, TAU); x.fill();
  x.fillStyle = '#8a5a2b'; x.beginPath(); x.arc(0, 0, 14, 0, TAU); x.fill();
  x.restore();
  x.save(); x.translate(CX, RCY - RR - 30); x.rotate(r.ptr * .5);
  x.fillStyle = '#e02b20'; x.strokeStyle = '#4a0d08'; x.lineWidth = 4;
  x.beginPath(); x.moveTo(-17, -14); x.lineTo(17, -14); x.lineTo(0, 48); x.closePath(); x.fill(); x.stroke();
  x.fillStyle = '#ffd84a'; x.beginPath(); x.arc(0, -8, 7, 0, TAU); x.fill();
  x.restore();
  if (r.st === 'ready') {
    const sc = 1 + .04 * Math.sin(performance.now() / 160);
    x.save(); x.translate(CX, 768); x.scale(sc, sc);
    x.fillStyle = 'rgba(0,0,0,.35)'; rrect(x, -148, -34, 300, 76, 18); x.fill();
    x.fillStyle = '#3f9e3a'; rrect(x, -150, -38, 300, 76, 18); x.fill();
    x.strokeStyle = '#266b24'; x.lineWidth = 5; rrect(x, -150, -38, 300, 76, 18); x.stroke();
    txt(x, 'GIRAR ROLETA', 0, 11, 32, '#fff', 'center', '#266b24');
    x.restore();
    txt(x, 'toque no botão, aperte Enter ou A no controle', CX, 830, 14, '#f3d9a4', 'center');
  } else if (r.st === 'spin') {
    txt(x, 'Girando…', CX, 780, 32, '#fff0cf', 'center', '#3d230d');
  } else {
    if (win) {
      txt(x, `VOCÊ GANHOU: ${PRIZES[r.prize].n.toUpperCase()}!`, CX, 780, 30, '#9dff8a', 'center', '#0d2b08');
      txt(x, 'Retire o seu brinde no estande', CX, 818, 17, '#f3d9a4', 'center');
    } else {
      txt(x, 'NÃO FOI DESSA VEZ!', CX, 780, 32, '#fff0cf', 'center', '#3d230d');
      txt(x, 'Obrigado por jogar. Tente de novo!', CX, 818, 17, '#f3d9a4', 'center');
    }
  }
  drawFx(x);
}

// ---------- Telas ----------
function show(html) { $('card').innerHTML = html; $('overlay').classList.add('show'); }
function hide() { $('overlay').classList.remove('show'); }
const tiltOk = () => typeof DeviceOrientationEvent !== 'undefined' && ('ontouchstart' in window || navigator.maxTouchPoints > 0);
function showMenu() {
  state = 'menu'; resetGame(); phaseIdx = 0; ph = PHASES[0]; clearAnimals(); buildLayers();
  paused = false;
  show(`${brandHtml()}<h1>🐂 Mestre do Confinamento 3D</h1>
    <p class="sub">Guie cada boi até o piquete certo antes que o tempo acabe.</p>
    <p>A câmera acompanha o boi pela manga, pela balança e até os piquetes.<br>Você controla só o <b>desvio lateral</b>:</p>
    <div class="keys"><kbd>←</kbd><kbd>→</kbd></div>
    <p class="sub">ou <b>A</b> / <b>D</b> · no celular, toque na metade esquerda ou direita da tela.<br>No controle: <b>analógico esquerdo</b> ou <b>direcional</b> para desviar; <b>A</b> / <b>Start</b> confirma e gira a roleta.</p>
    <p class="sub"><b>Start</b> ou <b>P</b> pausa o jogo · <b>F</b> liga a tela cheia.</p>
    <p class="sub" id="padinfo"></p>
    <p>Confira <b>raça</b> e <b>peso</b> com a placa de cada piquete. Acerto: <b>+100</b> pontos.</p>
    <p>Você tem <b>2 vidas ❤</b>. Piquete errado, boi travado na cerca ou tempo estourado custam <b>1 vida</b>. No fim da partida, gire a <b>roleta de brindes</b>: boné, mouse pad ou chaveiro!</p>
    <button class="go" id="go">Começar</button>${tiltOk() ? '<br><button class="go alt" id="tilt">Usar inclinação do celular</button>' : ''}`);
  $('go').onclick = () => { ensureAudio(); goFullscreen(); showIntro(0); };
  refreshPadInfo();
  const t = $('tilt'); if (t) t.onclick = async () => { ensureAudio(); t.textContent = (await enableTilt()) ? 'Inclinação ativada ✔' : 'Sensor indisponível'; };
}
function showIntro(i) {
  phaseIdx = i; ph = PHASES[i]; buildLayers(); state = 'intro';
  show(`<h2>Fase ${i + 1} · ${ph.name}</h2>
    <p>${ph.desc}</p>
    <div class="lanes">${ph.lanes.map((l, k) => `<div class="chip"><b style="background:${LANE_COLORS[k]}">PIQUETE ${LETTERS[k]}</b><span>${l.breed}<br>${l.range}</span></div>`).join('')}</div>
    <p class="sub">${ph.count} animais · ${ph.time} segundos</p>
    <button class="go" id="go">Bora!</button>`);
  $('go').onclick = () => { ensureAudio(); startPhase(i); };
}
function endPhase() {
  sfxPhase();
  if (phaseIdx < PHASES.length - 1) {
    // troca automática: só avisa na tela e segue para a próxima fase
    const nx = PHASES[phaseIdx + 1];
    state = 'phaseDone'; phaseTimer = 4.5; clearAnimals(); cur = null;
    show(`<h2>Fase ${phaseIdx + 1} concluída! 🎉</h2>
      <div class="stats"><div><i>${hits}</i>acertos</div><div><i>${errs}</i>erros</div><div><i>${Math.round(score)}</i>pontos</div><div><i>${lives}</i>vidas</div></div>
      <p><b>Próxima: Fase ${phaseIdx + 2} · ${nx.name}</b></p>
      <p class="sub">${nx.desc}</p>
      <div class="lanes">${nx.lanes.map((l, k) => `<div class="chip"><b style="background:${LANE_COLORS[k]}">PIQUETE ${LETTERS[k]}</b><span>${l.breed}<br>${l.range}</span></div>`).join('')}</div>
      <p class="sub">Começando automaticamente…</p>`);
    ph = nx; buildLayers(); ph = PHASES[phaseIdx];
  } else { wonGame = true; startRoulette(); }
}
function showGameOver(won) {
  state = 'gameover';
  show(`${brandHtml()}<h1>${won ? 'Lote finalizado! 🏆' : 'Game Over'}</h1>
    <p class="sub">${won ? 'Você separou o gado das 3 fases com vidas de sobra.' : 'As 2 vidas acabaram.'}</p>
    ${finalPrize ? `<p><b>🎁 Você ganhou: ${PRIZES[finalPrize].n}!</b><br><span class="sub">Retire o seu brinde no estande.</span></p>` : ''}
    <div class="stats"><div><i>${Math.round(score)}</i>pontuação final</div><div><i>${totHits}</i>acertos</div><div><i>${totErrs}</i>erros</div></div>
    <div class="wa">${qrSvg(132)}<p><b>Conheça o BeefSystem</b><br>Aponte a câmera do celular para o código e fale com a gente no WhatsApp.<br><b>${BRAND.waText}</b></p></div>
    <button class="go" id="go">Jogar Novamente</button>`);
  $('go').onclick = () => { ensureAudio(); goFullscreen(); resetGame(); showIntro(0); };
}

// ---------- Toque ----------
function setTouch(e) { touchDir = e.clientX < innerWidth / 2 ? -1 : 1; }
hud.addEventListener('pointerdown', e => {
  if (state === 'roulette') {
    const px = (e.clientX - OX) / S, py = (e.clientY - OY) / S;
    if (px > 200 && px < 520 && py > 720 && py < 820) spinRoulette();
    return;
  }
  if (state === 'playing') { setTouch(e); hud.setPointerCapture(e.pointerId); }
});
hud.addEventListener('pointermove', e => { if (touchDir) setTouch(e); });
for (const ev of ['pointerup', 'pointercancel']) hud.addEventListener(ev, () => { touchDir = 0; });

// ---------- Loop ----------
let lastTs = 0, cursorHidden = false;
function frame(ts) {
  const dt = Math.min(.05, (ts - lastTs) / 1000 || 0); lastTs = ts;
  if (paused) pollPad(); else update(dt);
  updateCamera(dt); sync3D();
  const hideCur = state === 'playing' && !paused;
  if (hideCur !== cursorHidden) { cursorHidden = hideCur; document.body.style.cursor = hideCur ? 'none' : ''; }
  renderer.render(scene, camera);
  drawOverlay();
  requestAnimationFrame(frame);
}
resize();
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
